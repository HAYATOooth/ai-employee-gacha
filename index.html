<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><title>AI社員7人 ガチャ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#27345c,#0b1020 55%,#05070e);color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;min-height:100vh}.app{max-width:760px;margin:auto;padding:16px 12px 42px}.hero{text-align:center}.eyebrow{font-size:11px;letter-spacing:.22em;color:#a9b9e8}.title{font-size:clamp(30px,8vw,52px);font-weight:1000;margin:5px 0}.sub{color:#b9c3dc;font-size:13px}.topbar{display:flex;gap:8px;margin:15px 0}.stat{flex:1;background:#11182b;border:1px solid #2d3a5e;border-radius:14px;padding:9px 10px}.stat b{display:block;font-size:19px}.stat span{font-size:10px;color:#9eabc9}.machine{position:relative;background:linear-gradient(180deg,#151e38,#0d1428);border:1px solid #34436d;border-radius:24px;padding:18px;box-shadow:0 18px 50px #0008;overflow:hidden}.machine:before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle,#5b78ff18,transparent 55%);pointer-events:none}.capsule{width:142px;height:142px;margin:8px auto 16px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#a9b5d4 48%,#53658e);box-shadow:0 0 35px #8aa2ff55,inset 0 -12px 20px #26304c}.capsule:after{content:"AI";font-weight:1000;font-size:34px;color:#18213b}.shake{animation:shake .65s infinite}.flash{animation:flash .6s ease}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:14px;padding:14px 9px;font-weight:900;font-size:14px;color:#fff;background:linear-gradient(135deg,#4b67ff,#7654ff);box-shadow:0 8px 20px #4055c944;cursor:pointer}.btn.secondary{background:#202a43;border:1px solid #3c4b72}.btn:disabled{opacity:.4;cursor:not-allowed}.hint{text-align:center;color:#8997b8;font-size:10px;margin-top:9px}.result{margin-top:14px;display:none}.result.show{display:block}.card{position:relative;background:#f7f9ff;color:#111827;border-radius:22px;padding:9px;box-shadow:0 20px 60px #0008;overflow:hidden}.rarity{position:absolute;z-index:2;top:11px;left:11px;background:#111a30;color:#fff;border-radius:999px;padding:7px 11px;font-weight:900;font-size:12px}.new-badge{position:absolute;z-index:3;top:11px;right:11px;background:#ff3d81;color:#fff;border-radius:999px;padding:7px 10px;font-weight:1000;font-size:11px}.card img{width:100%;height:360px;object-fit:cover;border-radius:16px;display:block}.info{padding:11px 8px 5px}.role{font-size:11px;color:#63708c}.name{font-size:25px;font-weight:1000;margin:2px 0}.desc{font-size:12px;color:#556078}.quote{margin-top:8px;padding:9px 11px;background:#edf1fb;border-radius:11px;font-weight:800;font-size:12px;color:#26324d}.panel{margin-top:16px;background:#11182b;border:1px solid #2d3a5e;border-radius:20px;padding:14px}.panel-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.panel-title h2{margin:0;font-size:19px}.muted{color:#8f9bb7;font-size:10px}.jobs{display:grid;grid-template-columns:1fr 1fr;gap:9px}.job{background:#18223a;border:1px solid #344263;border-radius:15px;padding:10px}.job h3{margin:0 0 4px;font-size:13px}.job p{margin:0 0 8px;color:#9eabc9;font-size:10px;line-height:1.45}.job button{width:100%;border:0;border-radius:10px;padding:9px;background:#314b91;color:#fff;font-weight:900;font-size:11px}.job button:disabled{opacity:.4}.employees{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.employee{background:#18223a;border:1px solid #344263;border-radius:15px;padding:8px}.employee img{width:100%;height:135px;object-fit:cover;border-radius:10px}.employee h3{font-size:13px;margin:6px 0 2px}.employee small{color:#9eabc9;font-size:10px}.xp{height:7px;background:#0b1020;border-radius:99px;overflow:hidden;margin:6px 0}.xp i{display:block;height:100%;background:linear-gradient(90deg,#4b67ff,#9b6cff);border-radius:99px}.employee button{width:100%;margin-top:5px;border:0;border-radius:9px;background:#263758;color:#fff;padding:7px;font-size:10px;font-weight:800}.collection{margin-top:16px}.section-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:9px}.section-title h2{margin:0;font-size:19px}.section-title span{font-size:11px;color:#9aa8c7}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.mini{background:#11182b;border:1px solid #2b3859;border-radius:15px;padding:7px;overflow:hidden;cursor:pointer}.mini.locked{filter:grayscale(1);opacity:.45}.mini img{width:100%;height:165px;object-fit:cover;border-radius:10px}.mini-name{font-weight:900;font-size:12px;margin-top:6px}.mini-role{font-size:9px;color:#8997b8}.foot{text-align:center;color:#65718e;font-size:10px;margin-top:20px}.modal,.detail{position:fixed;inset:0;background:#03050cf2;display:none;z-index:10;padding:18px;overflow:auto}.modal.show,.detail.show{display:block}.modal-box,.detail-box{max-width:700px;margin:24px auto;background:#10172a;border:1px solid #34436d;border-radius:20px;padding:15px}.close,.detail-close{float:right;border:0;background:#25304a;color:#fff;border-radius:10px;padding:7px 11px}.ten-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;clear:both;padding-top:13px}.ten-card{background:#f7f9ff;color:#111;border-radius:13px;padding:6px;opacity:0;transform:translateY(14px) scale(.96)}.ten-card.reveal{animation:reveal .35s ease forwards}.ten-card img{width:100%;height:180px;object-fit:cover;border-radius:9px}.ten-card b{font-size:12px}.ten-card small{display:block;color:#667085;font-size:9px}.ten-new{font-size:9px;font-weight:900;color:#ff2f78}.detail.show{display:flex;align-items:center;justify-content:center}.detail-box{width:min(520px,100%);background:#f7f9ff;color:#111827;position:relative}.detail-box img{width:100%;height:380px;object-fit:cover;border-radius:15px}.detail-close{position:absolute;right:14px;top:14px;z-index:2;border-radius:999px;width:36px;height:36px;font-size:19px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#fff;color:#111;padding:9px 15px;border-radius:999px;font-weight:800;display:none;z-index:30;white-space:nowrap;box-shadow:0 8px 25px #0006}.toast.show{display:block}.super{position:fixed;inset:0;display:none;z-index:25;pointer-events:none;background:radial-gradient(circle,#fff9,#a87aff44 25%,transparent 60%);animation:super .9s ease-out}.super.show{display:block}@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-12px) rotate(-5deg)}40%{transform:translateX(12px) rotate(5deg)}60%{transform:translateX(-8px) rotate(-4deg)}80%{transform:translateX(8px) rotate(4deg)}}@keyframes flash{0%{filter:brightness(1)}45%{filter:brightness(4)}100%{filter:brightness(1)}}@keyframes reveal{to{opacity:1;transform:none}}@keyframes super{0%{opacity:0;transform:scale(.7)}30%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
@media(max-width:500px){.card img{height:320px}.mini img{height:145px}.employee img{height:125px}.detail-box img{height:320px}.jobs{grid-template-columns:1fr 1fr}}
</style></head>
<body><main class="app">
<header class="hero"><div class="eyebrow">AI EMPLOYEE GACHA</div><div class="title">AI社員7人ガチャ</div><div class="sub">集めるだけじゃない。社員を働かせて、会社を育てよう。</div></header>
<div class="topbar"><div class="stat"><b id="coins">1,000</b><span>💰 コイン</span></div><div class="stat"><b id="companyLevel">Lv.1</b><span>🏢 会社レベル</span></div><div class="stat"><b id="rate">0%</b><span>📚 収集率</span></div><div class="stat"><b id="pulls">0</b><span>🎯 ガチャ回数</span></div></div>
<section class="machine"><div id="capsule" class="capsule"></div><div class="buttons"><button id="oneBtn" class="btn" onclick="pull(1)">🎯 1人引く<br><small>100コイン</small></button><button id="tenBtn" class="btn secondary" onclick="pull(10)">✨ 10連ガチャ<br><small>900コイン</small></button></div><div class="hint">Ver.3.0：ガチャで社員を集め、仕事でコインと経験値を稼ごう。</div></section>
<section id="result" class="result"><div class="card"><div id="rarity" class="rarity"></div><div id="newBadge" class="new-badge" style="display:none">✨ NEW!</div><img id="resultImg"><div class="info"><div id="resultRole" class="role"></div><div id="resultName" class="name"></div><div id="resultDesc" class="desc"></div><div id="quote" class="quote"></div></div></div></section>
<section class="panel"><div class="panel-title"><h2>💼 今日の仕事</h2><span class="muted">社員を派遣して報酬GET</span></div><div id="jobs" class="jobs"></div></section>
<section class="panel"><div class="panel-title"><h2>👥 社員育成</h2><span class="muted">仕事で経験値を貯めよう</span></div><div id="employees" class="employees"></div></section>
<section class="collection"><div class="section-title"><h2>📚 キャラクター図鑑</h2><span id="collectionText">7人中0人</span></div><div id="grid" class="grid"></div></section>
<div class="foot">AI社員チーム・Gacha v3.0 / 7 Characters</div></main>
<div id="modal" class="modal"><div class="modal-box"><button class="close" onclick="closeModal()">閉じる</button><h2>✨ 10連結果</h2><div id="tenGrid" class="ten-grid"></div></div></div>
<div id="detail" class="detail"><div class="detail-box"><button class="detail-close" onclick="closeDetail()">×</button><img id="detailImg"><div class="info"><div id="detailRole" class="role"></div><div id="detailName" class="name"></div><div id="detailDesc" class="desc"></div><div id="detailQuote" class="quote"></div></div></div></div>
<div id="toast" class="toast"></div><div id="super" class="super"></div>
<script>
const chars=[
{id:'president',name:'社長',role:'社長（あなた）',rarity:'UR',img:'1641.png',desc:'チームの最終判断を担う。7人目としてガチャに正式参戦。',quote:'「全員、仕事を始めよう。」',job:'経営判断',reward:180,xp:40},
{id:'planning',name:'企画担当',role:'企画担当',rarity:'SSR',img:'1642.png',desc:'データとアイデアから、次に挑む企画を生み出す。',quote:'「次、これでいきましょう。」',job:'企画を立てる',reward:150,xp:35},
{id:'research',name:'リサーチ担当',role:'リサーチ担当',rarity:'SSR',img:'1644.png',desc:'情報を集め、売れるテーマと可能性を見つけ出す。',quote:'「調べたところ、面白い傾向があります。」',job:'市場を調査',reward:140,xp:35},
{id:'design',name:'デザイン担当',role:'デザイン担当',rarity:'SR',img:'1653.png',desc:'記事や告知の見た目を磨き、伝わるデザインに仕上げる。',quote:'「見た目も、ちゃんと仕事です。」',job:'デザイン制作',reward:120,xp:30},
{id:'inspection',name:'検品担当',role:'検品担当',rarity:'SR',img:'1657.png',desc:'細部まで確認し、チームのアウトプット品質を守る。',quote:'「最後に、もう一度確認します。」',job:'品質チェック',reward:120,xp:30},
{id:'writing',name:'執筆担当',role:'執筆担当',rarity:'SR',img:'1658.png',desc:'読者に届く言葉へ。記事を最後まで書き上げる。',quote:'「まず、書き始めます。」',job:'記事を書く',reward:130,xp:32},
{id:'sales',name:'営業担当',role:'営業担当',rarity:'R',img:'1659.png',desc:'発信と告知を担当し、記事を読者へ届ける。',quote:'「まずは、届けてきます！」',job:'営業・告知',reward:100,xp:25}
];
const OLD='ai_employee_gacha_7_v2',KEY='ai_employee_gacha_7_v3';
let owned=JSON.parse(localStorage.getItem(KEY+'_owned')||localStorage.getItem(OLD)||'{}');let levels=JSON.parse(localStorage.getItem(KEY+'_levels')||'{}');let coins=Number(localStorage.getItem(KEY+'_coins')||1000);let pulls=Number(localStorage.getItem(KEY+'_pulls')||localStorage.getItem(OLD+'_pulls')||0);let busy=false;
chars.forEach(c=>{if(!levels[c.id])levels[c.id]={lv:1,xp:0}});
function save(){localStorage.setItem(KEY+'_owned',JSON.stringify(owned));localStorage.setItem(KEY+'_levels',JSON.stringify(levels));localStorage.setItem(KEY+'_coins',coins);localStorage.setItem(KEY+'_pulls',pulls)}
function companyLevel(){let total=Object.values(levels).reduce((s,x)=>s+x.xp+(x.lv-1)*100,0);return 1+Math.floor(total/500)}
function update(){const n=Object.keys(owned).length;document.getElementById('coins').textContent=coins.toLocaleString();document.getElementById('companyLevel').textContent='Lv.'+companyLevel();document.getElementById('rate').textContent=Math.round(n/7*100)+'%';document.getElementById('pulls').textContent=pulls;document.getElementById('collectionText').textContent=`7人中${n}人`;renderJobs();renderEmployees();document.getElementById('grid').innerHTML=chars.map(c=>`<div class="mini ${owned[c.id]?'':'locked'}" onclick="openDetail('${c.id}')"><img src="${c.img}" alt="${c.name}"><div class="mini-name">${owned[c.id]?'':'🔒 '}${c.name}</div><div class="mini-role">${c.role} · ${c.rarity}</div></div>`).join('')}
function weighted(){const r=Math.random();if(r<.08)return chars.find(c=>c.rarity==='UR');if(r<.25)return chars.filter(c=>c.rarity==='SSR')[Math.floor(Math.random()*2)];if(r<.68)return chars.filter(c=>c.rarity==='SR')[Math.floor(Math.random()*3)];return chars.find(c=>c.rarity==='R')}
function rarityBg(c){return c.rarity==='UR'?'linear-gradient(135deg,#9d5cff,#ffca58)':c.rarity==='SSR'?'#6a4cff':c.rarity==='SR'?'#1686d9':'#4b5568'}
function show(c,isNew){document.getElementById('result').classList.add('show');document.getElementById('resultImg').src=c.img;document.getElementById('resultRole').textContent=c.role;document.getElementById('resultName').textContent=c.name;document.getElementById('resultDesc').textContent=c.desc;document.getElementById('quote').textContent=c.quote;let r=document.getElementById('rarity');r.textContent=c.rarity;r.style.background=rarityBg(c);document.getElementById('newBadge').style.display=isNew?'block':'none';if(c.rarity==='UR'){const s=document.getElementById('super');s.classList.remove('show');void s.offsetWidth;s.classList.add('show');setTimeout(()=>s.classList.remove('show'),950)}}
function animate(done){const cap=document.getElementById('capsule');cap.classList.remove('shake','flash');void cap.offsetWidth;cap.classList.add('shake');setTimeout(()=>{cap.classList.remove('shake');cap.classList.add('flash');setTimeout(done,450)},650)}
function setBusy(v){busy=v;document.getElementById('oneBtn').disabled=v;document.getElementById('tenBtn').disabled=v}
function addXp(c,amount){let x=levels[c.id];x.xp+=amount;while(x.xp>=100){x.xp-=100;x.lv++;toast(`🎉 ${c.name} がLv.${x.lv}になった！`)}}
function pull(num){if(busy)return;const cost=num===10?900:100;if(coins<cost){toast('💰 コインが足りません。仕事をして稼ごう！');return}coins-=cost;setBusy(true);animate(()=>{if(num===10)tenPull();else{const c=weighted(),isNew=!owned[c.id];pulls++;owned[c.id]=true;addXp(c,isNew?10:18);save();show(c,isNew);update();toast(isNew?`✨ NEW！ ${c.name} が入社！`:`${c.name} を獲得！ 経験値+18`);setBusy(false)}})}
function tenPull(){const got=[];for(let i=0;i<10;i++){const c=weighted();const isNew=!owned[c.id];owned[c.id]=true;addXp(c,isNew?10:18);got.push({c,isNew})}pulls+=10;save();update();const grid=document.getElementById('tenGrid');grid.innerHTML=got.map(x=>`<div class="ten-card"><img src="${x.c.img}"><b>${x.c.rarity} ${x.c.name}</b>${x.isNew?'<div class="ten-new">✨ NEW!</div>':''}<small>${x.c.role}</small></div>`).join('');document.getElementById('modal').classList.add('show');[...grid.children].forEach((el,i)=>setTimeout(()=>el.classList.add('reveal'),i*120));setBusy(false)}
function renderJobs(){document.getElementById('jobs').innerHTML=chars.map(c=>{const locked=!owned[c.id];return `<div class="job"><h3>${c.job}</h3><p>${c.name}派遣<br>💰 +${c.reward} / ⭐ +${c.xp}</p><button ${locked?'disabled':''} onclick="work('${c.id}')">${locked?'未獲得':'仕事をさせる'}</button></div>`}).join('')}
function work(id){const c=chars.find(x=>x.id===id);if(!owned[id])return;coins+=c.reward;addXp(c,c.xp);save();update();toast(`💼 ${c.name}が仕事完了！ +${c.reward}コイン / +${c.xp}XP`)}
function renderEmployees(){document.getElementById('employees').innerHTML=chars.filter(c=>owned[c.id]).map(c=>{const x=levels[c.id];return `<div class="employee"><img src="${c.img}"><h3>${c.name} <small>Lv.${x.lv}</small></h3><div class="xp"><i style="width:${x.xp}%"></i></div><small>EXP ${x.xp}/100</small></div>`}).join('')||'<div class="muted">まずはガチャで社員を獲得しよう。</div>'}
function closeModal(){document.getElementById('modal').classList.remove('show')}function openDetail(id){const c=chars.find(x=>x.id===id);document.getElementById('detailImg').src=c.img;document.getElementById('detailRole').textContent=owned[id]?`${c.role} · ${c.rarity}`:'未獲得';document.getElementById('detailName').textContent=owned[id]?`${c.name} / Lv.${levels[id].lv}`:'？？？';document.getElementById('detailDesc').textContent=owned[id]?c.desc:'この社員はまだガチャから獲得していません。';document.getElementById('detailQuote').textContent=owned[id]?`${c.quote}　EXP ${levels[id].xp}/100`:'ガチャを回して入社してもらおう。';document.getElementById('detail').classList.add('show')}function closeDetail(){document.getElementById('detail').classList.remove('show')}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
update();save();
</script></body></html>
