function ensureCinema(){
  let o=document.getElementById('cinema');
  if(o)return o;
  const tpl=document.getElementById('cinemaTemplate');
  if(!tpl)return null;
  document.body.appendChild(tpl.content.cloneNode(true));
  return document.getElementById('cinema');
}
function startCinema(num){
  const o=ensureCinema();
  if(!o){setBusy(false);toast('演出画面を読み込めませんでした。');return;}

  try{
    clearCinemaTimers();
    cinemaMode=num; cinemaResult=null; cinemaStart=performance.now(); cinemaStage=0; openReady=false;
    resetGachaVisual();
    o.className='cinema cinema-active show';
    o.style.setProperty('display','block','important');o.style.setProperty('visibility','visible','important');o.style.setProperty('pointer-events','auto','important');
    o.classList.add('cinema-active','show');
    setScene('city');
    document.getElementById('cProgressBar').style.width='0%';
    document.getElementById('cTime').textContent='00.0 / 12.0';
    initAudio();
    if(soundOn){ tone(120,.22,'triangle',.045); playMachineStart(); playBgm(); }
    if(num===10) prepareCandidates(); else cinemaResult=weighted();
    setBusy(true);
    requestAnimationFrame(()=>{
      const gm=document.getElementById('gachaMachine'), pc=document.getElementById('physicalCapsule');
      if(gm) gm.classList.remove('hidden');
      if(pc) pc.classList.add('ready');
    });
    // V6.2: use requestAnimationFrame as the master cinematic clock.
    // This avoids the mobile-browser timer throttling/freeze that could leave the scene at 00.0.
    const loop=(now)=>{
      const current=document.getElementById('cinema');
      if(!current || !current.classList.contains('show')){cinemaRaf=null;return;}
      const elapsed=Math.max(0,Math.min(12000,now-cinemaStart));
      const b=document.getElementById('cProgressBar'),t=document.getElementById('cTime');
      if(b)b.style.width=(elapsed/12000*100)+'%';
      if(t)t.textContent=(elapsed/1000).toFixed(1)+' / 12.0';
      if(cinemaStage<1 && elapsed>=1200){cinemaStage=1;gachaStage(1)}
      if(cinemaStage<2 && elapsed>=2800){cinemaStage=2;gachaStage(2)}
      if(cinemaStage<3 && elapsed>=5000){cinemaStage=3;gachaStage(3)}
      if(cinemaStage<4 && elapsed>=7000){cinemaStage=4;gachaStage(4)}
      if(cinemaStage<5 && elapsed>=8500){cinemaStage=5;gachaStage(5)}
      if(!openReady && elapsed>=9800 && cinemaStage<5){cinemaStage=5;gachaStage(5)}
      cinemaRaf=requestAnimationFrame(loop);
    };
    cinemaRaf=requestAnimationFrame(loop);
  }catch(err){
    console.error('Gacha start error:',err);
    clearCinemaTimers();
    o.classList.remove('show');
    setBusy(false);
    try{toast('ガチャ演出を開始できませんでした。もう一度お試しください。')}catch(e){}
  }
}

function applyCinemaResult(){const c=cinemaResult;if(!c)return;const isNew=!owned[c.id];pulls++;owned[c.id]=true;addXp(c,isNew?10:18);save();update();playReveal(c);show(c,isNew);toast(isNew?`✨ NEW！ ${c.name} が入社！`:`${c.name} を獲得！ 経験値+18`)}

function showTenResults(got){const grid=document.getElementById('tenGrid');grid.innerHTML=got.map(x=>`<div class="ten-card"><img src="${x.c.img}"><b>${x.c.rarity} ${x.c.name}</b>${x.isNew?'<div class="ten-new">✨ NEW!</div>':''}<small>${x.c.role}</small></div>`).join('');document.getElementById('modal').classList.add('show');[...grid.children].forEach((el,i)=>setTimeout(()=>el.classList.add('reveal'),i*120));}

function closeModal(){document.getElementById('modal').classList.remove('show')}function openDetail(id){const c=chars.find(x=>x.id===id);document.getElementById('detailImg').src=c.img;document.getElementById('detailRole').textContent=owned[id]?`${c.role} · ${c.rarity}`:'未獲得';document.getElementById('detailName').textContent=owned[id]?`${c.name} / Lv.${levels[id].lv}`:'？？？';document.getElementById('detailDesc').textContent=owned[id]?c.desc:'この社員はまだガチャから獲得していません。';document.getElementById('detailQuote').textContent=owned[id]?`${c.quote}　Lv.${levels[id].lv} / EXP ${levels[id].xp}/100 / ${skillNames[id]} ${levels[id].skill}`:'ガチャを回して入社してもらおう。';document.getElementById('detail').classList.add('show')}function closeDetail(){document.getElementById('detail').classList.remove('show')}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
// V6.1: cinematic DOM is created lazily from a template only after a pull.
document.addEventListener('DOMContentLoaded',()=>{
  try{
    const cinema=document.getElementById('cinema');
    if(cinema){
      cinema.classList.remove('show');
      cinema.style.setProperty('display','none','important');
      cinema.style.setProperty('visibility','hidden','important');
      cinema.style.setProperty('pointer-events','none','important');
    }
    renderSoundButton();
    update();
    save();
  }catch(e){console.error('AI Employee Gacha init error',e)}
});
function hardResetCinema(){
  const cinema=document.getElementById('cinema');
  if(!cinema)return;
  clearCinemaTimers();
  cinema.classList.remove('show','cinema-active','hatch-open','door-phase','scene-purple','scene-gold','scene-ur','rarity-ur','rarity-ssr','rarity-sr');
  cinema.style.setProperty('display','none','important');
  cinema.style.setProperty('visibility','hidden','important');
  cinema.style.setProperty('pointer-events','none','important');
  const open=document.getElementById('openHatch');
  if(open)open.classList.remove('ready');
  openReady=false;
}
window.addEventListener('DOMContentLoaded',hardResetCinema);
window.addEventListener('load',hardResetCinema);
window.addEventListener('pageshow',hardResetCinema);
window.addEventListener('pagehide',hardResetCinema);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')hardResetCinema()});
</script>
