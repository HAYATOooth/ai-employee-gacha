<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#080b24">
<title>AI社員7人ガチャ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07091b;color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}button{font:inherit}.app{width:min(760px,100%);margin:auto;padding:10px 10px 40px}.hero{position:relative;overflow:hidden;border-radius:24px;padding:28px 16px 22px;text-align:center;background:linear-gradient(135deg,#19235fdd,#7b1fa2cc,#182d70dd),url("gacha_bg.png") center/cover;border:1px solid #ffffff35;box-shadow:0 15px 45px #0008}.hero:before{content:"";position:absolute;inset:-80%;background:conic-gradient(from 0deg,transparent,#48e9ff33,transparent 20%,#ff45c733,transparent 42%,#ffd84d33,transparent 66%);animation:spin 12s linear infinite}.hero>*{position:relative;z-index:1}.eyebrow{font-size:10px;letter-spacing:.32em;color:#8ff6ff;font-weight:900}.title{margin:6px 0;font-size:clamp(34px,10vw,58px);font-weight:1000;line-height:1.05;text-shadow:0 4px 25px #000,0 0 25px #6d7cff}.sub{font-size:13px;font-weight:800;text-shadow:0 2px 8px #000}.sound{display:block;margin:10px auto;border:1px solid #ffffff30;background:#111735;color:#fff;border-radius:999px;padding:8px 15px;font-weight:900;font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.stat{min-width:0;padding:9px 5px;text-align:center;border-radius:15px;background:linear-gradient(180deg,#18234b,#0e1430);border:1px solid #7185ff55;box-shadow:0 8px 20px #0005}.stat b{display:block;font-size:clamp(16px,5vw,23px);font-weight:1000}.stat span{font-size:9px;color:#b9c5ef;font-weight:800}.machine{position:relative;overflow:hidden;border-radius:28px;padding:22px 14px 15px;background:linear-gradient(180deg,#151d4fee,#090d24f2),url("gacha_bg.png") center/cover;border:1px solid #8194ff66;box-shadow:0 20px 60px #0009}.machine:after{content:"";position:absolute;left:5%;right:5%;top:10px;height:3px;border-radius:99px;background:linear-gradient(90deg,transparent,#43e7ff,#ff4fc3,#ffd84d,transparent);box-shadow:0 0 20px #43e7ff}.machine-label{text-align:center;font-size:9px;letter-spacing:.3em;color:#d7e5ff;font-weight:800}.orb{width:154px;height:154px;margin:24px auto 25px;border-radius:50%;position:relative;background:radial-gradient(circle at 30% 24%,#fff 0 5%,#b9edff 14%,#54bfff 32%,#645eff 50%,#c244ff 68%,#15163d 100%);border:2px solid #fff9;box-shadow:0 0 25px #43e7ff,0 0 85px #9c4dff88,inset -18px -25px 30px #05071b,inset 8px 8px 18px #fff8}.orb:before{content:"";position:absolute;inset:12px;border-radius:50%;border:2px solid #ffffff40;border-top-color:#fff;animation:spin 4s linear infinite}.orb:after{content:"AI";position:absolute;inset:0;display:grid;place-items:center;color:#0c1436;font-size:40px;font-weight:1000}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{min-height:62px;border:0;border-radius:17px;color:#fff;font-weight:1000;font-size:15px;background:linear-gradient(135deg,#4f6bff,#9d4fff 55%,#ff42bd);box-shadow:0 9px 25px #6b51ff66,inset 0 1px #fff6;position:relative;overflow:hidden}.btn:after{content:"";position:absolute;top:-100%;left:-25%;width:20%;height:300%;transform:rotate(22deg);background:#fff7;animation:shine 3s infinite}.btn.alt{background:linear-gradient(135deg,#1c2a61,#3150a1)}.btn:disabled{opacity:.4}.hint{text-align:center;color:#9da9cc;font-size:9px;margin-top:8px}.panel{margin-top:12px;padding:14px;border-radius:20px;background:linear-gradient(180deg,#121936,#0b1028);border:1px solid #6476c744;box-shadow:0 10px 30px #0005}.panel-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.panel h2{margin:0;font-size:19px}.muted{font-size:9px;color:#8f9cc1}.jobs,.employees,.collection-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.job,.employee,.mini{border-radius:15px;background:linear-gradient(145deg,#1b2853,#0e1635);border:1px solid #7182c644;padding:9px;box-shadow:0 7px 18px #0004}.job h3,.employee h3{margin:0 0 4px;font-size:13px}.job p{margin:0 0 7px;font-size:9px;line-height:1.5;color:#aab6dc}.job button,.train{width:100%;border:0;border-radius:10px;padding:8px;background:linear-gradient(135deg,#4967ff,#8e4fe5);color:#fff;font-size:10px;font-weight:1000}.employee img,.mini img{width:100%;height:125px;object-fit:cover;border-radius:10px;border:1px solid #fff2}.employee small{color:#b7c2e6}.bar{height:7px;background:#070b1c;border-radius:99px;overflow:hidden;margin:5px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#43e7ff,#586cff,#ff4fc3,#ffd84d);border-radius:99px}.emp-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px}.mini.locked{filter:grayscale(1);opacity:.42}.mini-name{font-weight:1000;font-size:12px;margin-top:5px}.mini-role{font-size:9px;color:#929fc2}.foot{text-align:center;color:#647195;font-size:9px;margin-top:16px}
/* Gacha stage */
.stage{position:fixed;inset:0;z-index:100;display:none;overflow:hidden;background:#05061a}.stage.show{display:block}.stage-bg{position:absolute;inset:0;background:linear-gradient(180deg,#07091f66,#050617ee),url("gacha_bg.png") center/cover}.stage-bg:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#ffffff10 0 8%,#4c63ff20 18%,#ff4fc314 32%,#02030be8 78%)}.scan{position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 7px,#fff1 8px 9px);opacity:.12;pointer-events:none}.stage-top{position:absolute;top:18px;left:14px;right:14px;display:flex;justify-content:space-between;z-index:20}.pill{padding:8px 12px;border:1px solid #ffffff30;background:#090d22cc;border-radius:999px;font-size:9px;font-weight:900;letter-spacing:.15em}.skip{border:1px solid #ffffff35;background:#0c1128;color:#fff;border-radius:999px;padding:8px 13px;font-size:10px;font-weight:900}.stage-title{position:absolute;top:12%;left:0;right:0;text-align:center;z-index:10}.stage-title small{display:block;color:#8ceeff;font-size:9px;letter-spacing:.35em;font-weight:900}.stage-title b{display:block;margin-top:6px;font-size:clamp(25px,8vw,48px);font-weight:1000;text-shadow:0 0 25px currentColor}.stage-orb{position:absolute;left:50%;top:48%;width:min(190px,50vw);aspect-ratio:1;transform:translate(-50%,-50%) scale(.25);opacity:0;border-radius:50%;background:radial-gradient(circle at 28% 22%,#fff 0 5%,#d9f7ff 13%,#55c8ff 31%,#6c54ff 51%,#e83fff 69%,#11163a 100%);border:2px solid #fff;box-shadow:0 0 35px #43e7ff,0 0 120px #ff45d766,inset -22px -30px 35px #04051b}.stage-orb:before{content:"AI";position:absolute;inset:0;display:grid;place-items:center;color:#0c1436;font-size:46px;font-weight:1000}.stage-orb.appear{animation:orbIn 1s cubic-bezier(.15,.9,.2,1) forwards}.stage-orb.charge{animation:charge .22s infinite}.stage-orb.open{animation:orbOpen .65s ease forwards}.burst{position:absolute;left:50%;top:48%;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 30px #fff,0 0 120px var(--c,#43e7ff);transform:translate(-50%,-50%) scale(.2);opacity:0}.burst.on{animation:burst .85s ease-out forwards}.rays{position:absolute;left:50%;top:48%;width:100vw;height:100vw;transform:translate(-50%,-50%) scale(.2);border-radius:50%;background:conic-gradient(#43e7ff00,#43e7ff55,#ff4fc344,#ffd84d55,#586cff44,#ff4fc344,#43e7ff00);opacity:0}.rays.on{animation:rays .9s ease-out forwards}.rarity{position:absolute;top:25%;left:50%;transform:translateX(-50%) scale(.6);opacity:0;font-size:clamp(42px,13vw,78px);font-weight:1000;letter-spacing:.1em;text-shadow:0 0 18px currentColor,0 0 50px currentColor;z-index:12}.rarity.show{animation:rarity .65s ease forwards}.open{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);z-index:30;border:2px solid #fff;background:linear-gradient(135deg,#fff,#78e6ff 30%,#665cff 65%,#ff45c4);color:#07102b;border-radius:999px;padding:15px 30px;font-size:13px;font-weight:1000;letter-spacing:.18em;box-shadow:0 0 25px #43e7ff,0 0 70px #ff45c466;animation:pulse 1.1s infinite}.open.ur{background:linear-gradient(135deg,#fff,#fff0a0,#ffd84d,#ff8b00);box-shadow:0 0 30px #ffd84d,0 0 80px #ff8b0066}.open.hidden{display:none}.result-img{position:absolute;left:50%;top:48%;width:min(340px,75vw);height:min(48vh,390px);object-fit:cover;transform:translate(-50%,-50%) scale(.45);opacity:0;border-radius:24px;border:2px solid #fff;z-index:15;box-shadow:0 0 45px var(--c,#43e7ff),0 25px 90px #000}.result-img.show{animation:resultIn 1s cubic-bezier(.12,.9,.2,1) forwards}.result-name{position:absolute;left:50%;bottom:15%;transform:translateX(-50%) scale(.7);opacity:0;z-index:18;white-space:nowrap;font-size:clamp(28px,8vw,48px);font-weight:1000;text-shadow:0 4px 20px #000,0 0 25px #fff}.result-name.show{animation:nameIn .6s .35s ease forwards}.result-sub{position:absolute;left:50%;bottom:10.5%;transform:translateX(-50%);opacity:0;z-index:18;font-size:10px;font-weight:900;letter-spacing:.12em}.result-sub.show{animation:fade .5s .55s forwards}.ten-results{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);width:min(390px,90vw);display:grid;grid-template-columns:repeat(5,1fr);gap:7px;z-index:18}.ten-card{opacity:0;transform:scale(.5);border-radius:50%;aspect-ratio:1;overflow:hidden;border:2px solid #78dfff;background:#18295b;box-shadow:0 0 15px #43e7ff77}.ten-card.show{animation:miniIn .35s forwards}.ten-card.ur{border-color:#ffd84d;box-shadow:0 0 22px #ffd84d}.ten-card img{width:100%;height:100%;object-fit:cover}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:300;background:#fff;color:#111;padding:9px 15px;border-radius:999px;font-size:11px;font-weight:1000;display:none;white-space:nowrap}.toast.show{display:block}.modal{position:fixed;inset:0;z-index:250;background:#03040beF;display:none;padding:18px;overflow:auto}.modal.show{display:block}.modal-box{max-width:650px;margin:25px auto;background:#101632;border:1px solid #7183cf66;border-radius:20px;padding:15px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.close{border:0;background:#27345f;color:#fff;border-radius:10px;padding:8px 12px}.modal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.modal-card{background:#f5f7ff;color:#111;border-radius:12px;padding:6px}.modal-card img{width:100%;height:180px;object-fit:cover;border-radius:9px}.modal-card b{font-size:12px}.new{color:#ff287f;font-size:9px;font-weight:1000}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes shine{0%,55%{left:-35%;opacity:0}65%{opacity:1}85%,100%{left:130%;opacity:0}}@keyframes orbIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}60%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes charge{0%{transform:translate(-50%,-50%) rotate(-4deg) scale(1)}50%{transform:translate(-50%,-50%) rotate(4deg) scale(1.05)}100%{transform:translate(-50%,-50%) rotate(-4deg) scale(1)}}@keyframes orbOpen{to{opacity:0;transform:translate(-50%,-50%) scale(2.5);filter:brightness(4)}}@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}25%{opacity:1;transform:translate(-50%,-50%) scale(3)}100%{opacity:0;transform:translate(-50%,-50%) scale(18)}}@keyframes rays{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5) rotate(45deg)}}@keyframes rarity{to{opacity:1;transform:translateX(-50%) scale(1)}}@keyframes pulse{50%{transform:translateX(-50%) scale(1.06);filter:brightness(1.15)}}@keyframes resultIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.45);filter:brightness(3) blur(10px)}45%{opacity:1;transform:translate(-50%,-50%) scale(1.06);filter:brightness(1.5) blur(1px)}100%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:none}}@keyframes nameIn{to{opacity:1;transform:translateX(-50%) scale(1)}}@keyframes fade{to{opacity:1}}@keyframes miniIn{to{opacity:1;transform:scale(1)}}
@media(max-width:500px){.app{padding:7px 8px 30px}.hero{padding:24px 10px 18px}.title{font-size:34px}.stats{gap:5px}.stat b{font-size:17px}.machine{padding-top:20px}.orb{width:145px;height:145px}.jobs,.employees{grid-template-columns:1fr 1fr}.employee img{height:110px}.result-img{height:40vh}.ten-results{gap:5px;width:86vw}}
</style>
</head>
<body>
<main class="app">
<header class="hero"><div class="eyebrow">AI EMPLOYEE GACHA</div><div class="title">AI社員7人ガチャ</div><div class="sub">集めるだけじゃない。社員を働かせて、会社を育てよう。</div></header>
<button id="sound" class="sound" onclick="toggleSound()">🔊 サウンド ON</button>
<div class="stats"><div class="stat"><b id="coins">1,000</b><span>💰 コイン</span></div><div class="stat"><b id="level">Lv.1</b><span>🏢 会社レベル</span></div><div class="stat"><b id="rate">0%</b><span>📚 収集率</span></div><div class="stat"><b id="pulls">0</b><span>🎯 ガチャ回数</span></div></div>
<section class="machine"><div class="machine-label">AI EMPLOYEE CAPSULE</div><div class="orb"></div><div class="buttons"><button class="btn" id="one" onclick="pull(1)">🎯 1人引く<br><small>100コイン</small></button><button class="btn alt" id="ten" onclick="pull(10)">✨ 10連ガチャ<br><small>900コイン</small></button></div><div class="hint">カラフルな演出で社員をスカウトしよう！</div></section>
<section class="panel"><div class="panel-head"><h2>💼 今日の仕事</h2><span class="muted">社員を派遣して報酬GET</span></div><div id="jobs" class="jobs"></div></section>
<section class="panel"><div class="panel-head"><h2>👥 社員育成</h2><span class="muted">強化して報酬UP</span></div><div id="employees" class="employees"></div></section>
<section class="panel"><div class="panel-head"><h2>📚 キャラクター図鑑</h2><span class="muted" id="collection">7人中0人</span></div><div id="collectionGrid" class="collection-grid"></div></section>
<div class="foot">AI社員チーム / 7 Characters</div>
</main>

<div id="stage" class="stage"><div class="stage-bg"></div><div class="scan"></div><div class="stage-top"><span class="pill">LIVE RECRUIT</span><button class="skip" onclick="skipStage()">スキップ</button></div><div id="stageTitle" class="stage-title"><small>AI EMPLOYEE CAPSULE</small><b>スカウト開始</b></div><div id="stageOrb" class="stage-orb"></div><div id="rays" class="rays"></div><div id="burst" class="burst"></div><div id="rarity" class="rarity"></div><button id="open" class="open hidden" onclick="openCapsule()">TAP TO OPEN</button><img id="resultImg" class="result-img"><div id="resultName" class="result-name"></div><div id="resultSub" class="result-sub"></div><div id="tenResults" class="ten-results" style="display:none"></div></div>

<div id="modal" class="modal"><div class="modal-box"><div class="modal-head"><h2>✨ 10連結果</h2><button class="close" onclick="closeModal()">閉じる</button></div><div id="modalGrid" class="modal-grid"></div></div></div>
<div id="toast" class="toast"></div>

<script>
const chars=[
{id:'president',name:'社長',role:'社長（あなた）',rarity:'UR',img:'1641.png',job:'経営判断',reward:180,xp:40,desc:'チームの最終判断を担う。',quote:'「全員、仕事を始めよう。」',skill:'経営力'},
{id:'planning',name:'企画担当',role:'企画担当',rarity:'SSR',img:'1642.png',job:'企画を立てる',reward:150,xp:35,desc:'次に挑む企画を生み出す。',quote:'「次、これでいきましょう。」',skill:'企画力'},
{id:'research',name:'リサーチ担当',role:'リサーチ担当',rarity:'SSR',img:'1644.png',job:'市場を調査',reward:140,xp:35,desc:'売れるテーマと可能性を探す。',quote:'「面白い傾向があります。」',skill:'分析力'},
{id:'design',name:'デザイン担当',role:'デザイン担当',rarity:'SR',img:'1653.png',job:'デザイン制作',reward:120,xp:30,desc:'伝わるデザインに仕上げる。',quote:'「見た目も、ちゃんと仕事です。」',skill:'デザイン力'},
{id:'inspection',name:'検品担当',role:'検品担当',rarity:'SR',img:'1657.png',job:'品質チェック',reward:120,xp:30,desc:'アウトプット品質を守る。',quote:'「最後に、もう一度確認します。」',skill:'品質力'},
{id:'writing',name:'執筆担当',role:'執筆担当',rarity:'SR',img:'1658.png',job:'記事を書く',reward:130,xp:32,desc:'読者に届く言葉へ書き上げる。',quote:'「まず、書き始めます。」',skill:'文章力'},
{id:'sales',name:'営業担当',role:'営業担当',rarity:'R',img:'1659.png',job:'営業・告知',reward:100,xp:25,desc:'記事を読者へ届ける。',quote:'「まずは、届けてきます！」',skill:'営業力'}];
const KEY='ai_employee_gacha_clean_v1';
let owned=JSON.parse(localStorage.getItem(KEY+'_owned')||localStorage.getItem('ai_employee_gacha_7_v3_owned')||'{}');
let levels=JSON.parse(localStorage.getItem(KEY+'_levels')||'{}');let coins=Number(localStorage.getItem(KEY+'_coins')||localStorage.getItem('ai_employee_gacha_7_v3_coins')||1000);let pulls=Number(localStorage.getItem(KEY+'_pulls')||localStorage.getItem('ai_employee_gacha_7_v3_pulls')||0);let busy=false,mode=1,current=null,currentTen=[],timer=null,soundOn=localStorage.getItem(KEY+'_sound')!=='off',audio=null;
chars.forEach(c=>{if(!levels[c.id])levels[c.id]={lv:1,xp:0,skill:0}});
function save(){localStorage.setItem(KEY+'_owned',JSON.stringify(owned));localStorage.setItem(KEY+'_levels',JSON.stringify(levels));localStorage.setItem(KEY+'_coins',coins);localStorage.setItem(KEY+'_pulls',pulls);localStorage.setItem(KEY+'_sound',soundOn?'on':'off')}
function companyLevel(){let v=Object.values(levels).reduce((s,x)=>s+x.xp+(x.lv-1)*100+x.skill*20,0);return 1+Math.floor(v/500)}
function rarityColor(r){return r==='UR'?'#ffd84d':r==='SSR'?'#c47cff':r==='SR'?'#43d7ff':'#d5e1f5'}
function weighted(){let r=Math.random();if(r<.08)return chars.find(c=>c.rarity==='UR');if(r<.25)return chars.filter(c=>c.rarity==='SSR')[Math.floor(Math.random()*2)];if(r<.68)return chars.filter(c=>c.rarity==='SR')[Math.floor(Math.random()*3)];return chars.find(c=>c.rarity==='R')}
function update(){let n=Object.keys(owned).length;document.getElementById('coins').textContent=coins.toLocaleString();document.getElementById('level').textContent='Lv.'+companyLevel();document.getElementById('rate').textContent=Math.round(n/7*100)+'%';document.getElementById('pulls').textContent=pulls;document.getElementById('collection').textContent=`7人中${n}人`;renderJobs();renderEmployees();document.getElementById('collectionGrid').innerHTML=chars.map(c=>`<div class="mini ${owned[c.id]?'':'locked'}"><img src="${c.img}"><div class="mini-name">${owned[c.id]?'':'🔒 '}${c.name}</div><div class="mini-role">${c.role} · ${c.rarity}</div></div>`).join('');document.getElementById('sound').textContent=soundOn?'🔊 サウンド ON':'🔇 サウンド OFF'}
function renderJobs(){document.getElementById('jobs').innerHTML=chars.map(c=>{let x=levels[c.id],r=Math.floor(c.reward*(1+(x.lv-1)*.05+x.skill*.02));return `<div class="job"><h3>💼 ${c.name} <small>Lv.${x.lv}</small></h3><p>${c.job}<br>💰 +${r} / EXP +${c.xp}<br>${c.skill} ${x.skill}</p><button onclick="doJob('${c.id}')">仕事をさせる</button></div>`}).join('')}
function renderEmployees(){document.getElementById('employees').innerHTML=chars.map(c=>{let x=levels[c.id],cost=100+x.skill*50;return `<div class="employee"><img src="${c.img}"><h3>${c.name} <small>Lv.${x.lv}</small></h3><div class="bar"><i style="width:${x.xp}%"></i></div><div style="font-size:8px;color:#aab6dc">EXP ${x.xp}/100 · ${c.skill} ${x.skill}</div><div class="emp-actions"><button class="train" onclick="train('${c.id}')" ${coins<cost||x.skill>=20?'disabled':''}>⬆ ${cost}💰</button><button class="train" onclick="doJob('${c.id}')">💼 仕事</button></div></div>`}).join('')}
function addXp(c,a){let x=levels[c.id];x.xp+=a;while(x.xp>=100){x.xp-=100;x.lv++;toast(`🎉 ${c.name} がLv.${x.lv}！`)}}
function doJob(id){let c=chars.find(x=>x.id===id),x=levels[id],r=Math.floor(c.reward*(1+(x.lv-1)*.05+x.skill*.02));coins+=r;addXp(c,c.xp);save();update();toast(`💼 ${c.name} 完了！ +${r}コイン`) }
function train(id){let c=chars.find(x=>x.id===id),x=levels[id],cost=100+x.skill*50;if(coins<cost||x.skill>=20)return;coins-=cost;x.skill++;save();update();tone(880,.12);toast(`⬆ ${c.name} の${c.skill}が ${x.skill}！`)}
function pull(n){if(busy)return;let cost=n===10?900:100;if(coins<cost){toast('💰 コインが足りません。仕事をして稼ごう！');return}coins-=cost;mode=n;busy=true;document.getElementById('one').disabled=true;document.getElementById('ten').disabled=true;current=n===1?weighted():null;currentTen=n===10?Array.from({length:10},()=>({c:weighted(),isNew:false})):[];startStage()}
function startStage(){clearTimeout(timer);let s=document.getElementById('stage'),orb=document.getElementById('stageOrb'),rar=document.getElementById('rarity'),open=document.getElementById('open'),img=document.getElementById('resultImg'),name=document.getElementById('resultName'),sub=document.getElementById('resultSub'),rays=document.getElementById('rays'),burst=document.getElementById('burst');s.classList.add('show');orb.className='stage-orb appear';rar.className='rarity';rar.textContent='';open.className='open hidden';img.className='result-img';img.src='';name.className='result-name';sub.className='result-sub';document.getElementById('tenResults').style.display='none';document.getElementById('stageTitle').innerHTML='<small>AI EMPLOYEE CAPSULE</small><b>スカウト開始</b>';timer=setTimeout(()=>{orb.classList.add('charge');let c=mode===1?current:(currentTen.find(x=>x.c.rarity==='UR')||currentTen.find(x=>x.c.rarity==='SSR')||currentTen[0]).c;rar.textContent=c.rarity;rar.style.color=rarityColor(c.rarity);rar.style.setProperty('--c',rarityColor(c.rarity));rar.classList.add('show');rays.classList.add('on');burst.style.setProperty('--c',rarityColor(c.rarity));burst.classList.add('on');document.getElementById('stageTitle').innerHTML='<small>SPECIAL SIGNAL</small><b style="color:'+rarityColor(c.rarity)+'">'+(c.rarity==='UR'?'LEGENDARY SIGNAL':'RARE SIGNAL')+'</b>';tone(c.rarity==='UR'?880:440,.25);timer=setTimeout(()=>{open.textContent=mode===10?'✨ TAP TO OPEN 10 CAPSULES':'✨ TAP TO OPEN';open.classList.remove('hidden');if(c.rarity==='UR')open.classList.add('ur')},700)},850)}
function openCapsule(){if(!busy)return;let c=mode===1?current:(currentTen.find(x=>x.c.rarity==='UR')||currentTen.find(x=>x.c.rarity==='SSR')||currentTen[0]).c;let orb=document.getElementById('stageOrb'),open=document.getElementById('open'),img=document.getElementById('resultImg'),name=document.getElementById('resultName'),sub=document.getElementById('resultSub');open.classList.add('hidden');orb.classList.remove('charge');orb.classList.add('open');document.getElementById('burst').classList.add('on');tone(c.rarity==='UR'?1200:650,.35);if(mode===10){showTenStage();return}img.src=c.img;img.style.setProperty('--c',rarityColor(c.rarity));img.className='result-img show';name.textContent=c.name+'、採用！';name.className='result-name show';sub.textContent=c.rarity+' / '+c.role;sub.className='result-sub show';timer=setTimeout(()=>finishOne(),1900)}
function showTenStage(){let box=document.getElementById('tenResults');box.innerHTML=currentTen.map((x,i)=>`<div class="ten-card ${x.c.rarity==='UR'?'ur':''}"><img src="${x.c.img}"></div>`).join('');box.style.display='grid';[...box.children].forEach((e,i)=>setTimeout(()=>e.classList.add('show'),i*80));document.getElementById('stageTitle').innerHTML='<small>RECRUITMENT COMPLETE</small><b>10人、採用。</b>';timer=setTimeout(()=>finishTen(),1500)}
function finishOne(){let c=current,isNew=!owned[c.id];owned[c.id]=true;pulls++;addXp(c,isNew?10:18);save();update();closeStage();showToastResult(c,isNew)}
function finishTen(){let got=currentTen.map(x=>{x.isNew=!owned[x.c.id];owned[x.c.id]=true;addXp(x.c,x.isNew?10:18);return x});pulls+=10;save();update();closeStage();showTenResults(got)}
function showToastResult(c,isNew){toast(isNew?`✨ NEW！ ${c.name} が入社！`:`${c.name} を獲得！`)}
function closeStage(){let s=document.getElementById('stage');s.classList.remove('show');document.getElementById('one').disabled=false;document.getElementById('ten').disabled=false;busy=false}
function skipStage(){if(!busy)return;if(mode===1){finishOne()}else finishTen()}
function showTenResults(got){let grid=document.getElementById('modalGrid');grid.innerHTML=got.map(x=>`<div class="modal-card"><img src="${x.c.img}"><b>${x.c.rarity} ${x.c.name}</b>${x.isNew?'<div class="new">✨ NEW!</div>':''}</div>`).join('');document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.remove('show'),1800)}
function initAudio(){if(!soundOn)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}
function tone(f,d=.15){if(!soundOn)return;initAudio();if(!audio)return;let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+d+.03)}
function toggleSound(){soundOn=!soundOn;save();update();if(soundOn)tone(660,.12)}
function clearTimeout(x){if(x)window.clearTimeout(x)}
update();save();
</script>
</body>
</html>
