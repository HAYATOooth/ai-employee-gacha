<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><title>AI社員7人 ガチャ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#27345c,#0b1020 55%,#05070e);color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;min-height:100vh}.app{max-width:760px;margin:auto;padding:18px 14px 40px}.hero{text-align:center}.eyebrow{font-size:12px;letter-spacing:.22em;color:#a9b9e8}.title{font-size:clamp(28px,8vw,52px);font-weight:900;margin:6px 0 2px}.sub{color:#b9c3dc;font-size:13px}.stats{display:flex;gap:8px;margin:16px 0}.stat{flex:1;background:#11182b;border:1px solid #2d3a5e;border-radius:14px;padding:10px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:#9eabc9}.machine{position:relative;background:linear-gradient(180deg,#151e38,#0d1428);border:1px solid #34436d;border-radius:24px;padding:20px;box-shadow:0 18px 50px #0008;overflow:hidden}.machine:before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle,#5b78ff18,transparent 55%);pointer-events:none}.capsule{width:150px;height:150px;margin:10px auto 18px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#a9b5d4 48%,#53658e);box-shadow:0 0 35px #8aa2ff55,inset 0 -12px 20px #26304c}.capsule:after{content:"AI";font-weight:1000;font-size:35px;color:#18213b}.shake{animation:shake .65s infinite}.flash{animation:flash .6s ease}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:14px;padding:15px 10px;font-weight:900;font-size:15px;color:#fff;background:linear-gradient(135deg,#4b67ff,#7654ff);box-shadow:0 8px 20px #4055c944;cursor:pointer}.btn.secondary{background:#202a43;border:1px solid #3c4b72}.btn:disabled{opacity:.45;cursor:not-allowed}.hint{text-align:center;color:#8997b8;font-size:11px;margin-top:10px}.result{margin-top:16px;display:none}.result.show{display:block}.card{position:relative;background:#f7f9ff;color:#111827;border-radius:22px;padding:10px;box-shadow:0 20px 60px #0008;overflow:hidden}.rarity{position:absolute;z-index:2;top:12px;left:12px;background:#111a30;color:#fff;border-radius:999px;padding:7px 12px;font-weight:900;font-size:12px}.card img{width:100%;height:380px;object-fit:cover;border-radius:16px;display:block}.info{padding:12px 8px 6px}.role{font-size:12px;color:#63708c}.name{font-size:26px;font-weight:1000;margin:2px 0}.desc{font-size:12px;color:#556078}.spark{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 40%,#fff8,transparent 22%);opacity:0;animation:spark .9s ease-out}.collection{margin-top:20px}.section-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.section-title h2{margin:0;font-size:20px}.section-title span{font-size:12px;color:#9aa8c7}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mini{background:#11182b;border:1px solid #2b3859;border-radius:16px;padding:8px;overflow:hidden}.mini.locked{filter:grayscale(1);opacity:.45}.mini img{width:100%;height:180px;object-fit:cover;border-radius:11px}.mini .mini-name{font-weight:900;font-size:13px;margin-top:7px}.mini .mini-role{font-size:10px;color:#8997b8}.foot{text-align:center;color:#65718e;font-size:10px;margin-top:22px}.modal{position:fixed;inset:0;background:#03050bcc;display:none;z-index:10;padding:20px;overflow:auto}.modal.show{display:block}.modal-box{max-width:700px;margin:30px auto;background:#10172a;border:1px solid #34436d;border-radius:20px;padding:16px}.close{float:right;border:0;background:#25304a;color:#fff;border-radius:10px;padding:8px 12px}.ten-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;clear:both;padding-top:15px}.ten-card{background:#f7f9ff;color:#111;border-radius:14px;padding:7px}.ten-card img{width:100%;height:190px;object-fit:cover;border-radius:10px}.ten-card b{font-size:13px}.ten-card small{display:block;color:#667085}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:999px;font-weight:800;display:none;z-index:20}.toast.show{display:block}@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-12px) rotate(-5deg)}40%{transform:translateX(12px) rotate(5deg)}60%{transform:translateX(-8px) rotate(-4deg)}80%{transform:translateX(8px) rotate(4deg)}}@keyframes flash{0%{filter:brightness(1)}45%{filter:brightness(4)}100%{filter:brightness(1)}}@keyframes spark{0%{opacity:0}25%{opacity:1}100%{opacity:0}}@media(max-width:500px){.card img{height:330px}.mini img{height:150px}.app{padding-left:10px;padding-right:10px}}

.new-badge{position:absolute;z-index:3;top:12px;right:12px;background:#ff3d81;color:#fff;border-radius:999px;padding:7px 11px;font-weight:1000;font-size:11px;box-shadow:0 4px 15px #ff3d8166}
.quote{margin-top:9px;padding:10px 12px;background:#edf1fb;border-radius:12px;font-weight:800;font-size:13px;color:#26324d}
.ten-card{opacity:0;transform:translateY(16px) scale(.96)}
.ten-card.reveal{animation:reveal .35s ease forwards}
.ten-new{font-size:10px;font-weight:900;color:#ff2f78}
.detail{position:fixed;inset:0;background:#03050cf2;display:none;z-index:12;padding:20px;overflow:auto}
.detail.show{display:flex;align-items:center;justify-content:center}
.detail-box{width:min(520px,100%);background:#f7f9ff;color:#111827;border-radius:22px;padding:10px;position:relative}
.detail-box img{width:100%;height:400px;object-fit:cover;border-radius:16px}
.detail-close{position:absolute;right:16px;top:16px;z-index:2;border:0;border-radius:999px;background:#111a30;color:#fff;width:38px;height:38px;font-size:20px}
.super{position:fixed;inset:0;display:none;z-index:30;pointer-events:none;background:radial-gradient(circle,#fff9,#a87aff44 25%,transparent 60%);animation:super .9s ease-out}
.super.show{display:block}
@keyframes reveal{to{opacity:1;transform:none}}
@keyframes super{0%{opacity:0;transform:scale(.7)}30%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
</style></head>
<body><main class="app"><header class="hero"><div class="eyebrow">AI EMPLOYEE GACHA</div><div class="title">AI社員7人ガチャ</div><div class="sub">社長を含む7人のチームを集めよう</div></header>
<div class="stats"><div class="stat"><b id="count">0 / 7</b><span>コンプリート</span></div><div class="stat"><b id="rate">0%</b><span>収集率</span></div><div class="stat"><b id="pulls">0</b><span>総ガチャ回数</span></div></div>
<section class="machine"><div id="capsule" class="capsule"></div><div class="buttons"><button class="btn" onclick="pull(1)">🎯 1人引く</button><button class="btn secondary" onclick="pull(10)">✨ 10連ガチャ</button></div><div class="hint">※スマホでそのまま遊べます。データはこのブラウザに保存されます。</div></section>
<section id="result" class="result"><div class="card"><div id="rarity" class="rarity"></div><div id="newBadge" class="new-badge" style="display:none">✨ NEW!</div><img id="resultImg"><div class="spark"></div><div class="info"><div id="resultRole" class="role"></div><div id="resultName" class="name"></div><div id="resultDesc" class="desc"></div><div id="quote" class="quote"></div></div></div></section>
<section class="collection"><div class="section-title"><h2>📚 キャラクター図鑑</h2><span id="collectionText">7人中0人</span></div><div id="grid" class="grid"></div></section>
<div class="foot">AI社員チーム・Gacha v2.0 / 7 Characters</div></main>
<div id="modal" class="modal"><div class="modal-box"><button class="close" onclick="closeModal()">閉じる</button><h2>✨ 10連結果</h2><div id="tenGrid" class="ten-grid"></div></div></div><div id="detail" class="detail"><div class="detail-box"><button class="detail-close" onclick="closeDetail()">×</button><img id="detailImg"><div class="info"><div id="detailRole" class="role"></div><div id="detailName" class="name"></div><div id="detailDesc" class="desc"></div><div id="detailQuote" class="quote"></div></div></div></div><div id="toast" class="toast"></div><div id="super" class="super"></div>
<script>
const chars=[
{id:'president',name:'社長',role:'社長（あなた）',rarity:'UR',img:'1641.png',desc:'チームの最終判断を担う。7人目としてガチャに正式参戦。',quote:'「全員、仕事を始めよう。」'},
{id:'planning',name:'企画担当',role:'企画担当',rarity:'SSR',img:'1642.png',desc:'データとアイデアから、次に挑む企画を生み出す。',quote:'「次、これでいきましょう。」'},
{id:'research',name:'リサーチ担当',role:'リサーチ担当',rarity:'SSR',img:'1644.png',desc:'情報を集め、売れるテーマと可能性を見つけ出す。',quote:'「調べたところ、面白い傾向があります。」'},
{id:'design',name:'デザイン担当',role:'デザイン担当',rarity:'SR',img:'1653.png',desc:'記事や告知の見た目を磨き、伝わるデザインに仕上げる。',quote:'「見た目も、ちゃんと仕事です。」'},
{id:'inspection',name:'検品担当',role:'検品担当',rarity:'SR',img:'1657.png',desc:'細部まで確認し、チームのアウトプット品質を守る。',quote:'「最後に、もう一度確認します。」'},
{id:'writing',name:'執筆担当',role:'執筆担当',rarity:'SR',img:'1658.png',desc:'読者に届く言葉へ。記事を最後まで書き上げる。',quote:'「まず、書き始めます。」'},
{id:'sales',name:'営業担当',role:'営業担当',rarity:'R',img:'1659.png',desc:'発信と告知を担当し、記事を読者へ届ける。',quote:'「まずは、届けてきます！」'}];
const key='ai_employee_gacha_7_v2';let owned=JSON.parse(localStorage.getItem(key)||'{}');let pulls=Number(localStorage.getItem(key+'_pulls')||0);
function save(){localStorage.setItem(key,JSON.stringify(owned));localStorage.setItem(key+'_pulls',pulls)}
function update(){const n=Object.keys(owned).length;document.getElementById('count').textContent=`${n} / 7`;document.getElementById('rate').textContent=Math.round(n/7*100)+'%';document.getElementById('pulls').textContent=pulls;document.getElementById('collectionText').textContent=`7人中${n}人`;document.getElementById('grid').innerHTML=chars.map(c=>`<div class="mini ${owned[c.id]?'':'locked'}" onclick="openDetail('${c.id}')"><img src="${c.img}" alt="${c.name}"><div class="mini-name">${owned[c.id]?'':'🔒 '}${c.name}</div><div class="mini-role">${c.role} · ${c.rarity}</div></div>`).join('')}
function weighted(){const r=Math.random();if(r<.08)return chars.find(c=>c.rarity==='UR');if(r<.25)return chars.filter(c=>c.rarity==='SSR')[Math.floor(Math.random()*2)];if(r<.68)return chars.filter(c=>c.rarity==='SR')[Math.floor(Math.random()*3)];return chars.find(c=>c.rarity==='R')}
function rarityColor(c){return c.rarity==='UR'?'linear-gradient(135deg,#9d5cff,#ffca58)':c.rarity==='SSR'?'#6a4cff':c.rarity==='SR'?'#1686d9':'#4b5568'}
function show(c,isNew){
 document.getElementById('result').classList.add('show');
 document.getElementById('resultImg').src=c.img;
 document.getElementById('resultRole').textContent=c.role;
 document.getElementById('resultName').textContent=c.name;
 document.getElementById('resultDesc').textContent=c.desc;
 document.getElementById('quote').textContent=c.quote;
 const r=document.getElementById('rarity');r.textContent=c.rarity;r.style.background=rarityColor(c);
 const nb=document.getElementById('newBadge');nb.style.display=isNew?'block':'none';
 if(c.rarity==='UR'){const sp=document.getElementById('super');sp.classList.remove('show');void sp.offsetWidth;sp.classList.add('show');setTimeout(()=>sp.classList.remove('show'),950)}
}
function animate(done){const cap=document.getElementById('capsule');cap.classList.remove('shake','flash');void cap.offsetWidth;cap.classList.add('shake');setTimeout(()=>{cap.classList.remove('shake');cap.classList.add('flash');setTimeout(done,500)},700)}
function pull(num){if(num===10){animate(()=>tenPull());return}animate(()=>{const c=weighted();const isNew=!owned[c.id];pulls++;owned[c.id]=true;save();show(c,isNew);update();toast(isNew?`✨ NEW！ ${c.name} を獲得！`:`${c.name} を獲得！`)})}
function tenPull(){const got=[];for(let i=0;i<10;i++){const c=weighted();got.push({c,isNew:!owned[c.id]});owned[c.id]=true}pulls+=10;save();update();document.getElementById('tenGrid').innerHTML=got.map(x=>`<div class="ten-card"><img src="${x.c.img}"><b>${x.c.rarity} ${x.c.name}</b>${x.isNew?'<div class="ten-new">✨ NEW!</div>':''}<small>${x.c.role}</small></div>`).join('');document.getElementById('modal').classList.add('show');[...document.getElementById('tenGrid').children].forEach((el,i)=>setTimeout(()=>el.classList.add('reveal'),i*130))}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openDetail(id){const c=chars.find(x=>x.id===id);document.getElementById('detailImg').src=c.img;document.getElementById('detailRole').textContent=owned[c.id]?c.role:'？？？';document.getElementById('detailName').textContent=owned[c.id]?c.name:'未獲得';document.getElementById('detailDesc').textContent=owned[c.id]?c.desc:'この社員はまだガチャから獲得していません。';document.getElementById('detailQuote').textContent=owned[c.id]?c.quote:'ガチャを回して入社してもらおう。';document.getElementById('detail').classList.add('show')}
function closeDetail(){document.getElementById('detail').classList.remove('show')}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}
update();
</script></body></html>
